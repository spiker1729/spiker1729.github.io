<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="An amazing animated birthday wish page with next-gen graphics and effects">
    <meta name="theme-color" content="#ff6b6b">
    <meta property="og:title" content="Happy Birthday!">
    <meta property="og:description" content="A special birthday wish with amazing animations">
    <meta property="og:type" content="website">
    <title>Happy Birthday! 🎉</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎉</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #f7b731, #5f27cd, #ff6b6b);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            will-change: background-position;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .birthday-text {
            font-size: 8vw;
            font-weight: 900;
            text-align: center;
            color: #fff;
            -webkit-text-stroke: 3px #000;
            text-stroke: 3px #000;
            paint-order: stroke fill;
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.8),
                0 0 20px rgba(255, 255, 255, 0.6),
                0 0 30px rgba(255, 255, 255, 0.4),
                0 0 40px rgba(255, 182, 193, 0.8),
                0 0 70px rgba(255, 182, 193, 0.6),
                0 0 80px rgba(255, 182, 193, 0.4);
            animation: textFloat 3s ease-in-out infinite, colorShift 4s ease-in-out infinite;
            transform-style: preserve-3d;
            letter-spacing: 0.1em;
            z-index: 10;
            position: relative;
            will-change: transform, color, text-shadow;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes textFloat {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        @keyframes colorShift {
            0%, 100% { 
                color: #fff;
                -webkit-text-stroke: 4px #fbf8f8;
                text-shadow: 
                    0 0 10px rgba(255, 255, 255, 0.8),
                    0 0 20px rgba(255, 255, 255, 0.6),
                    0 0 30px rgba(255, 255, 255, 0.4),
                    0 0 40px rgba(255, 182, 193, 0.8),
                    0 0 70px rgba(255, 182, 193, 0.6);
            }
            25% { 
                color: #ffd700;
                -webkit-text-stroke: 3px #000;
                text-shadow: 
                    0 0 10px rgba(255, 215, 0, 0.8),
                    0 0 20px rgba(255, 215, 0, 0.6),
                    0 0 30px rgba(255, 215, 0, 0.4),
                    0 0 40px rgba(255, 140, 0, 0.8),
                    0 0 70px rgba(255, 140, 0, 0.6);
            }
            50% { 
                color: #ff69b4;
                -webkit-text-stroke: 3px #000;
                text-shadow: 
                    0 0 10px rgba(255, 105, 180, 0.8),
                    0 0 20px rgba(255, 105, 180, 0.6),
                    0 0 30px rgba(255, 105, 180, 0.4),
                    0 0 40px rgba(138, 43, 226, 0.8),
                    0 0 70px rgba(138, 43, 226, 0.6);
            }
            75% { 
                color: #00ffff;
                -webkit-text-stroke: 3px #000;
                text-shadow: 
                    0 0 10px rgba(0, 255, 255, 0.8),
                    0 0 20px rgba(0, 255, 255, 0.6),
                    0 0 30px rgba(0, 255, 255, 0.4),
                    0 0 40px rgba(0, 191, 255, 0.8),
                    0 0 70px rgba(0, 191, 255, 0.6);
            }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #f0f;
            position: absolute;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .particle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            animation: particleFloat 3s ease-out forwards;
        }

        @keyframes particleFloat {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), var(--y)) scale(0);
                opacity: 0;
            }
        }

        .firework {
            position: fixed;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: fireworkBurst 1s ease-out forwards;
        }

        @keyframes fireworkBurst {
            0% {
                transform: translate(0, 0);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty));
                opacity: 0;
            }
        }

        .balloon {
            position: fixed;
            bottom: -150px;
            width: 80px;
            height: 100px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: balloonFloat 6s ease-in-out forwards;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
        }

        @keyframes balloonFloat {
            0% {
                bottom: -150px;
                transform: translateX(0) rotate(0deg);
            }
            50% {
                transform: translateX(30px) rotate(5deg);
            }
            100% {
                bottom: 110vh;
                transform: translateX(-30px) rotate(-5deg);
            }
        }

        .star {
            position: fixed;
            font-size: 30px;
            animation: starTwinkle 2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes starTwinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.2) rotate(180deg); }
        }

        .glow-orb {
            position: fixed;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.6;
            animation: orbFloat 8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30vw, -20vh) scale(1.2); }
            66% { transform: translate(-30vw, 20vh) scale(0.8); }
        }

        .sparkle {
            position: fixed;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            animation: sparkleAnim 1.5s ease-in-out infinite;
            box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8);
        }

        @keyframes sparkleAnim {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 768px) {
            .birthday-text {
                font-size: 12vw;
            }
        }
    </style>
</head>
<body>
    <div class="birthday-text">HAPPY BIRTHDAY</div>

    <script>
        // Create glowing orbs
        function createGlowOrbs() {
            const colors = ['#ff6b6b', '#4ecdc4', '#ffd93d', '#a8e6cf', '#ff88dc', '#95e1d3'];
            for (let i = 0; i < 5; i++) {
                const orb = document.createElement('div');
                orb.className = 'glow-orb';
                orb.style.background = colors[i % colors.length];
                orb.style.left = Math.random() * 100 + '%';
                orb.style.top = Math.random() * 100 + '%';
                orb.style.animationDelay = Math.random() * 3 + 's';
                document.body.appendChild(orb);
            }
        }

        // Create continuous confetti
        function createConfetti() {
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f7b731', '#5f27cd', '#ff69b4', '#ffd93d', '#95e1d3'];
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.top = '-10px';
            confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.width = Math.random() * 15 + 5 + 'px';
            confetti.style.height = Math.random() * 15 + 5 + 'px';
            confetti.style.animationDuration = Math.random() * 3 + 3 + 's';
            confetti.style.opacity = Math.random() * 0.7 + 0.3;
            
            const shapes = ['square', 'circle', 'rectangle'];
            const shape = shapes[Math.floor(Math.random() * shapes.length)];
            if (shape === 'circle') {
                confetti.style.borderRadius = '50%';
            } else if (shape === 'rectangle') {
                confetti.style.width = Math.random() * 20 + 5 + 'px';
                confetti.style.height = Math.random() * 8 + 3 + 'px';
            }
            
            document.body.appendChild(confetti);
            
            setTimeout(() => confetti.remove(), 6000);
        }

        // Create fireworks
        function createFirework(x, y) {
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f7b731', '#5f27cd', '#ff69b4', '#ffd93d'];
            const particleCount = 40;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'firework';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                const angle = (Math.PI * 2 * i) / particleCount;
                const velocity = 100 + Math.random() * 100;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                particle.style.boxShadow = `0 0 10px ${colors[Math.floor(Math.random() * colors.length)]}`;
                
                document.body.appendChild(particle);
                
                setTimeout(() => particle.remove(), 1000);
            }
        }

        // Create balloons
        function createBalloon() {
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f7b731', '#5f27cd', '#ff69b4', '#ffd93d', '#95e1d3'];
            const balloon = document.createElement('div');
            balloon.className = 'balloon';
            balloon.style.left = Math.random() * 90 + '%';
            balloon.style.background = colors[Math.floor(Math.random() * colors.length)];
            balloon.style.animationDuration = Math.random() * 3 + 5 + 's';
            
            document.body.appendChild(balloon);
            
            setTimeout(() => balloon.remove(), 8000);
        }

        // Create stars
        function createStars() {
            const starChars = ['⭐', '✨', '💫', '🌟'];
            for (let i = 0; i < 20; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.textContent = starChars[Math.floor(Math.random() * starChars.length)];
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                star.style.animationDuration = Math.random() * 2 + 1 + 's';
                document.body.appendChild(star);
            }
        }

        // Create sparkles
        function createSparkles() {
            for (let i = 0; i < 30; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';
                sparkle.style.animationDelay = Math.random() * 1.5 + 's';
                document.body.appendChild(sparkle);
            }
        }

        // Mouse and touch interaction - create particles on click/tap
        function handleInteraction(e) {
            e.preventDefault();
            const x = e.clientX || (e.touches && e.touches[0].clientX) || window.innerWidth / 2;
            const y = e.clientY || (e.touches && e.touches[0].clientY) || window.innerHeight / 2;
            
            createFirework(x, y);
            
            // Create party popper effect
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.width = Math.random() * 10 + 5 + 'px';
                particle.style.height = particle.style.width;
                
                const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f7b731', '#5f27cd', '#ff69b4'];
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                const x_offset = (Math.random() - 0.5) * 300;
                const y_offset = (Math.random() - 0.5) * 300;
                particle.style.setProperty('--x', x_offset + 'px');
                particle.style.setProperty('--y', y_offset + 'px');
                
                document.body.appendChild(particle);
                
                setTimeout(() => particle.remove(), 3000);
            }
        }

        document.addEventListener('click', handleInteraction);
        document.addEventListener('touchstart', handleInteraction, { passive: false });

        // Auto fireworks
        function randomFirework() {
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * window.innerHeight;
            createFirework(x, y);
        }

        // Initialize everything
        createGlowOrbs();
        createStars();
        createSparkles();

        // Continuous effects
        setInterval(createConfetti, 150);
        setInterval(createBalloon, 2000);
        setInterval(randomFirework, 2000);

        // Initial burst of fireworks
        setTimeout(() => {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    randomFirework();
                }, i * 300);
            }
        }, 500);
    </script>
</body>
</html>
